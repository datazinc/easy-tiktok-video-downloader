name: Release Extension Builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync
        run: npm run verify:versions

      - name: Verify download regressions
        run: npm run verify:recovery

      - name: Verify localization and resume summaries
        run: npm run verify:localization

      - name: Compute release metadata
        id: metadata
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          SHORT_SHA=$(git rev-parse --short "$GITHUB_SHA")
          RELEASE_TAG="main-v${VERSION}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          RELEASE_NAME="Main build v${VERSION} (${SHORT_SHA})"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Chromium package
        run: npm run build:prod

      - name: Build Firefox package
        run: npm run buildff:prod

      - name: Assemble release assets
        run: npm run release:assets

      - name: Verify release packages
        run: |
          npm run verify:packages
          npm run verify:release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          name: ${{ steps.metadata.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Production Installation
            - [Chrome Web Store (Chrome / Chromium / Brave)](https://chromewebstore.google.com/detail/easy-tiktok-video-downloa/fclobfmgolhdcfcmpbjahiiifilhamcg)
            - [Mozilla Add-ons (Firefox)](https://addons.mozilla.org/en-US/firefox/addon/tiktok-downloader-bulk/)

            GitHub assets are development and store-submission archives, not production installers. Store approval and update timing are independent of this GitHub release. See INSTALL.md for temporary/developer testing and SHA256SUMS.txt for asset checksums.
          files: |
            release-artifacts/*
